<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Can Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --negro: #1a1a1a;
            --blanco: #ffffff;
            --crema: #f9f8f6; /* Un fondo un poquito más claro, muy estilo editorial */
            --gris-suave: #777777;
            --dorado: #c5a880; /* Un tono dorado sutil para detalles */
        }

        body {
            background-color: var(--crema);
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: var(--negro);
        }

        /* --- BARRA DE NAVEGACIÓN (Igual que el index) --- */
        .navbar {
            background-color: var(--blanco);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #eaeaea; /* Línea fina súper elegante */
        }

        .nav-logo {
            font-family: 'Pacifico', cursive;
            font-size: 24px;
            text-decoration: none;
            color: var(--negro);
        }

        .nav-links a {
            text-decoration: none;
            color: var(--negro);
            margin-left: 25px;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--dorado);
        }

        /* --- SECCIÓN CONTACTO --- */
        .contact-container {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 20px;
            text-align: center;
        }

        .contact-title {
            font-family: 'Pacifico', cursive;
            font-size: 45px;
            margin-bottom: 10px;
            color: var(--negro);
            font-weight: normal;
        }

        .contact-subtitle {
            font-size: 12px;
            font-weight: 400;
            color: var(--gris-suave);
            margin-bottom: 60px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .contact-grid {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Tarjetas estilo minimalista / boutique */
        .contact-card {
            background-color: var(--blanco);
            width: 320px;
            padding: 50px 30px;
            border: 1px solid #eaeaea; /* Bordes finos, nada de sombras pesadas */
            text-decoration: none;
            color: var(--negro);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        /* Efecto al pasar el mouse */
        .contact-card:hover {
            transform: translateY(-5px);
            border-color: var(--dorado);
            box-shadow: 0 15px 30px rgba(0,0,0,0.04);
        }

        .contact-icon {
            font-size: 35px;
            margin-bottom: 25px;
            /* Íconos en blanco y negro para mantener lo premium */
            filter: grayscale(100%); 
            transition: all 0.4s;
        }

        .contact-card:hover .contact-icon {
            filter: grayscale(0%); /* Devuelve el color original al pasar el mouse */
        }

        .card-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .card-text {
            font-size: 13px;
            color: var(--gris-suave);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Botón estilo "Ghost" (muy usado en marcas de lujo) */
        .btn-link {
            padding: 12px 30px;
            border: 1px solid var(--negro);
            background: transparent;
            color: var(--negro);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .contact-card:hover .btn-link {
            background-color: var(--negro);
            color: var(--blanco);
        }

        @media (max-width: 600px) {
            .contact-container { margin: 40px auto; }
            .contact-grid { flex-direction: column; align-items: center; gap: 20px;}
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">Can Bakery</a>
        <div class="nav-links">
            <a href="index.html">Menú</a>
            <a href="contacto.html">Contacto</a>
        </div>
    </nav>

    <div class="contact-container" style="max-width: 900px; margin: 100px auto; text-align: center; padding: 0 20px;">
    <h1 class="contact-title" style="font-family: 'Pacifico', cursive; font-size: 45px; margin-bottom: 10px;">Pedidos</h1>
    <p class="contact-subtitle" style="font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #777; margin-bottom: 60px;">Atención directa vía WhatsApp</p>
    
    <div style="display: flex; justify-content: center;">
        <a href="https://wa.me/TU_NUMERO" target="_blank" class="contact-card" style="background: #fff; width: 350px; padding: 60px; border: 1px solid #eaeaea; text-decoration: none; color: #1a1a1a; transition: 0.4s;">
            <div style="font-size: 40px; margin-bottom: 20px;">💬</div>
            <h2 style="font-size: 18px; font-weight: 500; letter-spacing: 1px; margin-bottom: 15px;">WHATSAPP</h2>
            <p style="font-size: 13px; color: #777; font-weight: 300; line-height: 1.6; margin-bottom: 30px;">Escribinos para coordinar tu entrega o consultar por pedidos especiales.</p>
            <div style="padding: 12px; border: 1px solid #1a1a1a; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px;">Chatear ahora</div>
        </a>
    </div>
</div>

</body>
</html>
