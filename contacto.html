<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Can Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root { --negro: #1a1a1a; --blanco: #ffffff; --crema: #f9f8f6; --dorado: #c5a880; }
        body { background-color: var(--crema); margin: 0; font-family: 'Montserrat', sans-serif; color: var(--negro); }
        
        /* --- NAVBAR (Unificada) --- */
        .navbar { background-color: var(--blanco); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; position: sticky; top: 0; z-index: 1000; }
        .logo-img { height: 45px; width: auto; transform: scale(2.0); transform-origin: left center; }
        .nav-links { display: flex; }
        .nav-links a { text-decoration: none; color: var(--negro); margin-left: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; transition: 0.3s; }
        .nav-links a:hover { color: var(--dorado); }
        .menu-toggle { display: none; font-size: 28px; cursor: pointer; }

        /* Ícono de menú hamburguesa (Oculto en PC) */
        .menu-toggle { display: none; font-size: 32px; cursor: pointer; color: var(--negro); }

        /* --- MODO CELULAR --- */
        @media (max-width: 768px) {
            .nav-links { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: var(--blanco); padding: 20px 0; border-top: 1px solid #eee; box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
            .nav-links.active { display: flex; }
            .nav-links a { margin: 15px 0; text-align: center; }
            .menu-toggle { display: block; }
            .accordion-content { flex-direction: column; }
            .product-img, .product-info { width: 100%; }
            .product-img { margin-bottom: 15px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html"><img src="canBakery_logo_navBar Background Removed.png" alt="Logo" class="logo-img"></a>
        <i class="bi bi-list menu-toggle" id="menu-icon"></i>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Inicio</a>
            <a href="menu.html">Menú</a>
            <a href="faq.html">FAQ</a>
            <a href="contacto.html">Contacto</a>
            <a href="redes.html">Redes</a>
        </div>
    </nav>

    <div style="max-width: 900px; margin: 100px auto; text-align: center; padding: 0 20px;">
        <h1 style="font-family: 'Pacifico', cursive; font-size: 45px; margin-bottom: 10px;">Pedidos</h1>
        <p style="font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #777; margin-bottom: 60px;">Atención directa vía WhatsApp</p>
        
        <div style="display: flex; justify-content: center;">
            <a href="https://wa.me/5491144096837" target="_blank" style="background: #fff; width: 350px; padding: 60px; border: 1px solid #eaeaea; text-decoration: none; color: #1a1a1a; transition: 0.4s; display: block;">
                <div class="icon" style="font-size: 40px; margin-bottom: 20px;"><i class="bi bi-whatsapp"></i></div>
                <h2 style="font-size: 18px; font-weight: 500; letter-spacing: 1px; margin-bottom: 15px; text-transform: uppercase;">WhatsApp</h2>
                <p style="font-size: 13px; color: #777; font-weight: 300; line-height: 1.6; margin-bottom: 30px;">Escribinos para coordinar tu entrega o consultar por pedidos especiales.</p>
                <div style="padding: 12px; border: 1px solid #1a1a1a; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; display: inline-block;">Chatear ahora</div>
            </a>
        </div>
    </div>

    <script>
        const menuIcon = document.getElementById('menu-icon');
        const navLinks = document.getElementById('nav-links');

        menuIcon.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            
            if(navLinks.classList.contains('active')) {
                menuIcon.classList.remove('bi-list');
                menuIcon.classList.add('bi-x');
            } else {
                menuIcon.classList.remove('bi-x');
                menuIcon.classList.add('bi-list');
            }
        });
    </script>
</body>
</html>
