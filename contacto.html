<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Can Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --negro: #1a1a1a; --blanco: #ffffff; --crema: #f9f8f6; --dorado: #c5a880; }
        body { background-color: var(--crema); margin: 0; font-family: 'Montserrat', sans-serif; color: var(--negro); }
        
        /* --- NAVBAR --- */
        .navbar { background-color: var(--blanco); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; }
        .nav-logo { font-family: 'Pacifico', cursive; font-size: 24px; text-decoration: none; color: var(--negro); }
        
        .nav-links a { 
            text-decoration: none; 
            color: var(--negro); 
            margin-left: 25px; 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: color 0.3s ease; 
        }
        
        /* Efecto al pasar el mouse */
        .nav-links a:hover { color: var(--dorado); }

        @media (max-width: 600px) { .nav-links { display: none; } }

        .logo-img {
            height: 45px; /* Podés achicar o agrandar este número según como quede */
            width: auto;
            display: block;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="canBakery_logo.jpeg" alt="Can Bakery" class="logo-img">
        </a>
        <div class="nav-links">
            <a href="index.html">Menú</a>
            <a href="contacto.html">Contacto</a>
            <a href="redes.html">Redes</a>
        </div>
    </nav>

    <div style="max-width: 900px; margin: 100px auto; text-align: center; padding: 0 20px;">
        <h1 style="font-family: 'Pacifico', cursive; font-size: 45px; margin-bottom: 10px;">Pedidos</h1>
        <p style="font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #777; margin-bottom: 60px;">Atención directa vía WhatsApp</p>
        
        <div style="display: flex; justify-content: center;">
            <a href="https://wa.me/5491144096837" target="_blank" style="background: #fff; width: 350px; padding: 60px; border: 1px solid #eaeaea; text-decoration: none; color: #1a1a1a; transition: 0.4s; display: block;">
                <div class="icon" style="font-size: 40px; margin-bottom: 20px;"><i class="bi bi-whatsapp"></i></div>
                <h2 style="font-size: 18px; font-weight: 500; letter-spacing: 1px; margin-bottom: 15px; text-transform: uppercase;">WhatsApp</h2>
                <p style="font-size: 13px; color: #777; font-weight: 300; line-height: 1.6; margin-bottom: 30px;">Escribinos para coordinar tu entrega o consultar por pedidos especiales.</p>
                <div style="padding: 12px; border: 1px solid #1a1a1a; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; display: inline-block;">Chatear ahora</div>
            </a>
        </div>
    </div>
</body>
</html>
