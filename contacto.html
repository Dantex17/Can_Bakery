<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Can Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --negro: #1a1a1a; --blanco: #ffffff; --crema: #f9f8f6; --dorado: #c5a880; }
        body { background-color: var(--crema); margin: 0; font-family: 'Montserrat', sans-serif; color: var(--negro); }
        
        .navbar { background-color: var(--blanco); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; }
        .nav-logo { font-family: 'Pacifico', cursive; font-size: 24px; text-decoration: none; color: var(--negro); }
        .nav-links a { text-decoration: none; color: var(--negro); margin-left: 25px; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }

        .container { max-width: 1000px; margin: 80px auto; padding: 0 20px; text-align: center; }
        .title { font-family: 'Pacifico', cursive; font-size: 45px; margin-bottom: 50px; }
        
        .grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        
        .social-card {
            background: var(--blanco);
            width: 260px;
            padding: 40px 20px;
            border: 1px solid #eaeaea;
            text-decoration: none;
            color: var(--negro);
            transition: 0.4s;
        }
        .social-card:hover { border-color: var(--dorado); transform: translateY(-5px); }
        .icon { font-size: 30px; margin-bottom: 20px; }
        .name { font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
        .desc { font-size: 12px; color: #777; font-weight: 300; margin-bottom: 20px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">Can Bakery</a>
        <div class="nav-links">
            <a href="index.html">Menú</a>
            <a href="contacto.html">Contacto</a>
        </div>
    </nav>

    <div class="contact-container" style="max-width: 900px; margin: 100px auto; text-align: center; padding: 0 20px;">
    <h1 class="contact-title" style="font-family: 'Pacifico', cursive; font-size: 45px; margin-bottom: 10px;">Pedidos</h1>
    <p class="contact-subtitle" style="font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #777; margin-bottom: 60px;">Atención directa vía WhatsApp</p>
    
    <div style="display: flex; justify-content: center;">
        <a href="https://wa.me/TU_NUMERO" target="_blank" class="contact-card" style="background: #fff; width: 350px; padding: 60px; border: 1px solid #eaeaea; text-decoration: none; color: #1a1a1a; transition: 0.4s;">
            <div style="font-size: 40px; margin-bottom: 20px;">💬</div>
            <h2 style="font-size: 18px; font-weight: 500; letter-spacing: 1px; margin-bottom: 15px;">WHATSAPP</h2>
            <p style="font-size: 13px; color: #777; font-weight: 300; line-height: 1.6; margin-bottom: 30px;">Escribinos para coordinar tu entrega o consultar por pedidos especiales.</p>
            <div style="padding: 12px; border: 1px solid #1a1a1a; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px;">Chatear ahora</div>
        </a>
    </div>
</div>

</body>
</html>
