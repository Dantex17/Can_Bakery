<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes - Can Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --negro: #1a1a1a; --blanco: #ffffff; --crema: #f9f8f6; --dorado: #c5a880; }
        body { background-color: var(--crema); margin: 0; font-family: 'Montserrat', sans-serif; color: var(--negro); }
        
        /* --- NAVBAR (Unificada) --- */
        .navbar { background-color: var(--blanco); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; position: sticky; top: 0; z-index: 1000; }
        .logo-img { height: 45px; width: auto; transform: scale(2.0); transform-origin: left center; }
        .nav-links { display: flex; }
        .nav-links a { text-decoration: none; color: var(--negro); margin-left: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; transition: 0.3s; }
        .nav-links a:hover { color: var(--dorado); }
        .menu-toggle { display: none; font-size: 28px; cursor: pointer; }

        /* Ícono de menú hamburguesa (Oculto en PC) */
        .menu-toggle { display: none; font-size: 32px; cursor: pointer; color: var(--negro); }

        /* --- MODO CELULAR --- */
        @media (max-width: 768px) {
            .nav-links { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: var(--blanco); padding: 20px 0; border-top: 1px solid #eee; box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
            .nav-links.active { display: flex; }
            .nav-links a { margin: 15px 0; text-align: center; }
            .menu-toggle { display: block; }
            .accordion-content { flex-direction: column; }
            .product-img, .product-info { width: 100%; }
            .product-img { margin-bottom: 15px; }
        }
        
        /* Efecto al pasar el mouse */
        .nav-links a:hover { color: var(--dorado); }

        /* --- SECCIÓN REDES --- */
        .container { max-width: 1000px; margin: 80px auto; padding: 0 20px; text-align: center; }
        .title { font-family: 'Pacifico', cursive; font-size: 45px; margin-bottom: 50px; }
        
        .grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        
        .social-card {
            background: var(--blanco);
            width: 260px;
            padding: 40px 20px;
            border: 1px solid #eaeaea;
            text-decoration: none;
            color: var(--negro);
            transition: 0.4s;
        }
        .social-card:hover { border-color: var(--dorado); transform: translateY(-5px); }
        .icon { font-size: 30px; margin-bottom: 20px; }
        .name { font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
        .desc { font-size: 12px; color: #777; font-weight: 300; margin-bottom: 20px; }

        @media (max-width: 600px) { .nav-links { display: none; } }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html"><img src="canBakery_logo_navBar Background Removed.png" alt="Logo" class="logo-img"></a>
        <i class="bi bi-list menu-toggle" id="menu-icon"></i>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Inicio</a>
            <a href="menu.html">Menú</a>
            <a href="faq.html">FAQ</a>
            <a href="contacto.html">Contacto</a>
            <a href="redes.html">Redes</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="title">Comunidad</h1>
        <div class="grid">
            <a href="https://instagram.com/canbakery.ar" target="_blank" class="social-card">
                <div class="icon"><i class="bi bi-instagram"></i></div>
                <div class="name">Instagram</div>
                <p class="desc">Nuestras fotos y procesos diarios.</p>
            </a>
            <a href="https://tiktok.com/@canbakery.ar" target="_blank" class="social-card">
                <div class="icon"><i class="bi bi-tiktok"></i></div>
                <div class="name">TikTok</div>
                <p class="desc">Videos del detrás de escena.</p>
            </a>
            <a href="https://facebook.com/TU_USER" target="_blank" class="social-card">
                <div class="icon"><i class="bi bi-facebook"></i></div>
                <div class="name">Facebook</div>
                <p class="desc">Novedades y comunidad.</p>
            </a>
        </div>
    </div>

    <script>
        const menuIcon = document.getElementById('menu-icon');
        const navLinks = document.getElementById('nav-links');

        menuIcon.addEventListener('click', () => {
            // Abre y cierra el menú
            navLinks.classList.toggle('active');
            
            // Cambia el dibujo de las 3 rayitas a una "X" y viceversa
            if(navLinks.classList.contains('active')) {
                menuIcon.classList.remove('bi-list');
                menuIcon.classList.add('bi-x');
            } else {
                menuIcon.classList.remove('bi-x');
                menuIcon.classList.add('bi-list');
            }
        });
    </script>
</body>
</html>
