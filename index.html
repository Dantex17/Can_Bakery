<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can Bakery - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --negro: #1a1a1a; --blanco: #ffffff; --crema: #f9f8f6; --dorado: #c5a880; }
        body { background-color: var(--crema); margin: 0; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        /* --- NAVBAR (Unificada) --- */
        .navbar { background-color: var(--blanco); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; position: sticky; top: 0; z-index: 1000; }
        .logo-img { height: 45px; width: auto; transform: scale(1.6); transform-origin: left center; }
        .nav-links { display: flex; }
        .nav-links a { text-decoration: none; color: var(--negro); margin-left: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; transition: 0.3s; }
        .nav-links a:hover { color: var(--dorado); }
        .menu-toggle { display: none; font-size: 28px; cursor: pointer; }

        /* --- HERO SLIDER (Estilo Luna y Wanda) --- */
        .hero { position: relative; width: 100%; height: 85vh; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; color: white; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }
        /* Filtro oscuro encima de la foto */
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: 1; }
        .hero-content { position: relative; z-index: 2; padding: 0 20px; max-width: 700px; }
        .hero-content h1 { font-family: 'Montserrat', sans-serif; font-size: 38px; font-weight: 500; letter-spacing: 2px; line-height: 1.2; margin-bottom: 30px; text-transform: uppercase; }
        .hero-content .btn-cta { display: inline-block; padding: 15px 40px; border: 1px solid white; color: white; text-decoration: none; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; transition: 0.4s; }
        .hero-content .btn-cta:hover { background: white; color: black; }

        /* --- INFO SECCIÓN --- */
        .info-section { padding: 80px 20px; text-align: center; background: white; }
        .info-section h2 { font-family: 'Pacifico', cursive; font-size: 32px; color: var(--negro); }
        .info-section p { max-width: 600px; margin: 20px auto; color: #777; font-weight: 300; line-height: 1.8; }

        /* --- MODO CELULAR --- */
        @media (max-width: 768px) {
            .nav-links { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: var(--blanco); padding: 20px 0; border-top: 1px solid #eee; box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
            .nav-links.active { display: flex; }
            .nav-links a { margin: 15px 0; text-align: center; }
            .menu-toggle { display: block; }
            .accordion-content { flex-direction: column; }
            .product-img, .product-info { width: 100%; }
            .product-img { margin-bottom: 15px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html"><img src="canBakery_logo_navBar.jpeg" alt="Logo" class="logo-img"></a>
        <i class="bi bi-list menu-toggle" id="menu-icon"></i>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Inicio</a>
            <a href="menu.html">Menú</a>
            <a href="faq.html">FAQ</a>
            <a href="contacto.html">Contacto</a>
            <a href="redes.html">Redes</a>
        </div>
    </nav>

    <header class="hero">
        <div class="slide active" style="background-image: url('foto1.jpeg');"></div>
        <div class="slide" style="background-image: url('foto2.jpeg');"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>El postre con el que quedas bien, siempre.</h1>
            <a href="menu.html" class="btn-cta">Ver Menú</a>
        </div>
    </header>

    <section class="info-section">
        <h2>Artesanal y en lata</h2>
        <p>Una nueva forma de disfrutar el Tiramisú clásico y de pistacho y mas por venir. Listos para llevar, perfectos para compartir.</p>
    </section>

    <script>
        // JS para el menú hamburguesa
        const menuIcon = document.getElementById('menu-icon');
        const navLinks = document.getElementById('nav-links');
        menuIcon.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            menuIcon.classList.toggle('bi-x');
        });

        // JS para el carrusel automático
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 4000); // Cambia cada 4 segundos
    </script>
</body>
</html>
