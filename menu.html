<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Can Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Fondo de la página (crema muy suave para contrastar con la tarjeta) */
        body {
            background-color: #f4f1eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        /* La "imagen" o tarjeta del menú */
        .menu-card {
            background-color: #ffffff; /* Fondo blanco impecable como en tu logo */
            width: 380px;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); /* Sombra suave para darle volumen */
            text-align: center;
        }

        /* Estilo del logo */
        .logo {
            font-family: 'Pacifico', cursive; /* Tipografía gruesa y cursiva similar a la de tu lata */
            font-size: 55px;
            color: #1a1a1a; /* Negro intenso */
            margin: 0;
            line-height: 1.1;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        /* Contenedor de la lista */
        .menu-list {
            text-align: left;
        }

        /* Fila de cada producto */
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 25px;
            border-bottom: 1px dotted #cccccc;
            padding-bottom: 10px;
        }

        .item-name {
            font-weight: 600;
            font-size: 18px;
            color: #222222;
        }

        .item-price {
            font-weight: 600;
            font-size: 18px;
            color: #222222;
        }

        .item-desc {
            display: block;
            font-size: 13px;
            color: #777777;
            margin-top: 4px;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="menu-card">
        <h1 class="logo">Can<br>Bakery</h1>

        <div class="menu-list">
            
            <div class="menu-item">
                <div>
                    <span class="item-name">Tiramisú Clásico</span>
                    <span class="item-desc">Café, mascarpone y cacao</span>
                </div>
                <span class="item-price">$X.XXX</span>
            </div>

            <div class="menu-item">
                <div>
                    <span class="item-name">Tiramisú de Pistacho</span>
                    <span class="item-desc">Crema de pistacho y mascarpone</span>
                </div>
                <span class="item-price">$X.XXX</span>
            </div>

        </div>
    </div>

</body>
</html>
